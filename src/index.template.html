<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dog Chase!</title>
  <meta name="description" content="Pick a dog and chase squirrels before time runs out. Free, 60 seconds a round.">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dog Chase">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Dog Chase!">
  <meta property="og:description" content="Pick a dog and chase squirrels before time runs out. Free, 60 seconds a round.">
  <meta property="og:url" content="https://dogchase.eldoggosoftware.com/">
  <meta property="og:image" content="https://dogchase.eldoggosoftware.com/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="preload" href="fonts/nunito-900.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family:'Nunito'; font-weight:400; font-display:swap; src:url(fonts/nunito-400.woff2) format('woff2'); }
    @font-face { font-family:'Nunito'; font-weight:700; font-display:swap; src:url(fonts/nunito-700.woff2) format('woff2'); }
    @font-face { font-family:'Nunito'; font-weight:900; font-display:swap; src:url(fonts/nunito-900.woff2) format('woff2'); }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#0d1117; overflow:hidden; }
    /* Keep the game clear of notches and system bars: env() on the web, plus the
       --safe-area-inset-* variables Capacitor sets for older Android WebViews. */
    #game { position:fixed;
      top:var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
      bottom:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      left:var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
      right:var(--safe-area-inset-right, env(safe-area-inset-right, 0px)); }
    canvas { touch-action:none; }
  </style>
</head>
<body>
<div id="game"></div>
<script src="vendor/phaser-__PHASER_VERSION__.min.js"></script>
<script>__GAME_SCRIPT__</script>
<!-- Offline support for the website. The store apps already ship every file, so they skip it. -->
<script>if('serviceWorker' in navigator && !window.Capacitor) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
