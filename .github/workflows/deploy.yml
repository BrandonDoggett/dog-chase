name: Deploy to AWS

on:
  push:
    branches: [main, master]

# Deploy credentials come from GitHub's OIDC token, exchanged for a short-lived AWS
# role that can only upload this site and invalidate its CDN. No AWS key is stored
# in this repository. The role's ARN is the AWS_DEPLOY_ROLE_ARN secret, which keeps
# the account id out of a public file.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      # --ignore-scripts: no package needs an install script to build, and this
      # job goes on to hold deploy credentials.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Build (minify, inject API URL, PWA assets)
        run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: dogchase-deploy-${{ github.run_id }}
          aws-region: us-east-1

      # Assets first and HTML last, so the live page never points at a file
      # that hasn't been uploaded yet.
      - name: Upload to S3
        run: |
          B=s3://dogchase-eldoggosoftware
          aws s3 cp dist/vendor $B/vendor --recursive --content-type "text/javascript" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/fonts $B/fonts --recursive --content-type "font/woff2" --cache-control "public, max-age=2592000"
          aws s3 cp dist/icons $B/icons --recursive --content-type "image/png" --cache-control "public, max-age=86400"
          aws s3 cp dist/manifest.webmanifest $B/manifest.webmanifest --content-type "application/manifest+json" --cache-control "no-cache"
          aws s3 cp dist/privacy.html $B/privacy.html --content-type "text/html" --cache-control "public, max-age=3600"
          aws s3 cp dist/sw.js $B/sw.js --content-type "text/javascript" --cache-control "no-cache"
          aws s3 cp dist/index.html $B/index.html --content-type "text/html" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3DSN9XE0HJ8WL \
            --paths "/*"
